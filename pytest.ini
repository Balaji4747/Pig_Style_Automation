[pytest]
testpaths = tests

markers =
    smoke: Core happy-path checks that must pass on every build
    sanity: Quick confidence checks after a build/deploy
    regression: Full regression suite
    ui: UI/UX checks
    functional: Functional game behavior checks
    math: Math/RTP/paytable validation checks
    compatibility: Cross-browser/device compatibility checks
    interruption: Interruption handling checks
    recovery: Recovery-after-interruption checks
    negative: Error-handling / invalid-input checks
    boundary: Edge/boundary-value checks
    integration: Transaction/STR integration checks
    test_case(id): Workbook test case ID this test covers (e.g. "PS-INT-001"); a test can carry several

addopts =
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    --output=reports/test-results
    --html=reports/report.html --self-contained-html
    --alluredir=reports/allure-results

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
